[project]
name = "report-checker-backend"
version = "0.1.0"
description = "Backend service for automated checking of student reports and VKR templates"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.10",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "aiobotocore",
    "pdfplumber",
    "pymupdf",
    "pikepdf",
    "python-jose[cryptography]",
    "httpx",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers",
    "httpx",
    "factory-boy",
    "ruff",
    "mypy",
    "bandit",
    "minio",
    "pikepdf",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: integration tests requiring testcontainers",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "B008",   # Depends() in defaults is FastAPI's intended pattern
    "RUF001", # Cyrillic in user-facing strings (rule names, messages) is intentional
]

[tool.ruff.lint.per-file-ignores]
# uuid required at runtime for SQLAlchemy Mapped[uuid.UUID] annotation resolution
"app/adapters/driven/persistence/database/models/check_result.py" = ["TC003"]
"app/adapters/driven/persistence/database/models/document.py" = ["TC003"]
"app/adapters/driving/web/schemas/auth.py" = ["TC003"]
"app/adapters/driving/web/schemas/document.py" = ["TC003"]
"app/adapters/driving/internal/schemas.py" = ["TC001", "TC003"]
"app/adapters/driving/web/v1/documents.py" = ["TC003"]
"app/adapters/driving/web/v1/checks.py" = ["TC003"]
"app/adapters/driving/internal/router.py" = ["TC003"]
"app/adapters/driving/web/schemas/rule.py" = ["TC003"]
"app/adapters/driving/web/v1/rules.py" = ["TC003"]
"tests/unit/checkers/test_practice_structure_required_sections.py" = ["E501"]
"tests/unit/checkers/test_vkr_structure_required_sections.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

